[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-demand-forecasting"
version = "0.1.0"
description = "Leakage-aware retail forecasting and inventory decision support"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.2,<3", "scikit-learn>=1.5,<1.9",
  "joblib>=1.4,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1",
  "streamlit>=1.40,<2", "httpx>=0.27,<1", "openpyxl>=3.1,<4",
  "matplotlib>=3.9,<4", "threadpoolctl>=3.5,<4"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
[project.scripts]
retail = "retail.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
